<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b5cff">

<title>نتيجة الشهادة السودانية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Cairo",sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(11,92,255,.09),
            transparent 30%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(11,92,255,.06),
            transparent 28%
        ),
        #f6f8fc;

    color:#101828;
}

.page{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;

    padding:20px 15px 30px;
}

.wrapper{
    width:100%;
    max-width:500px;
}


/* =========================================
   TOP
========================================= */

.top-area{
    position:relative;

    min-height:180px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    margin-bottom:20px;
}


/* =========================================
   CORNER IMAGES
========================================= */

.corner-logo{
    position:absolute;

    width:84px;
    height:84px;

    border-radius:50%;

    background:#fff;

    padding:2px;

    object-fit:cover;

    border:1px solid #fff;

    box-shadow:
        0 10px 30px rgba(15,23,42,.15);

    z-index:5;
}

.corner-right{
    top:0;
    right:1px;
}

.corner-left{
    top:0;
    left:1px;
}


/* =========================================
   BRAND
========================================= */

.brand-icon{
    width:64px;
    height:64px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #0b5cff,
            #1748c7
        );

    box-shadow:
        0 14px 32px rgba(11,92,255,.20);

    margin-bottom:10px;
}

.brand-icon svg{
    width:32px;
    height:32px;

    stroke:#fff;
}

.top-area h1{
    font-size:23px;
    font-weight:800;

    line-height:1.5;
}

.top-area p{
    margin-top:3px;

    color:#7b8495;

    font-size:12px;
    font-weight:500;
}


/* =========================================
   MAIN CARD
========================================= */

.main-card{
    background:#fff;

    border:1px solid rgba(15,23,42,.055);

    border-radius:27px;

    padding:24px;

    box-shadow:
        0 20px 60px rgba(15,23,42,.07),
        0 3px 12px rgba(15,23,42,.025);
}


/* =========================================
   CARD HEADER
========================================= */

.card-head{
    margin-bottom:21px;
}

.card-title{
    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:6px;
}

.card-title-icon{
    width:39px;
    height:39px;

    border-radius:12px;

    background:#edf4ff;

    display:flex;
    align-items:center;
    justify-content:center;
}

.card-title-icon svg{
    width:19px;
    height:19px;

    stroke:#0b5cff;
}

.card-title h2{
    font-size:16px;
    font-weight:800;
}

.card-head p{
    color:#8791a3;

    font-size:11px;

    line-height:1.8;
}


/* =========================================
   INPUT
========================================= */

.input-label{
    display:block;

    font-size:13px;
    font-weight:700;

    color:#344054;

    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    width:22px;
    height:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.input-icon svg{
    width:18px;
    height:18px;

    stroke:#98a2b3;
}

#serial{
    width:100%;
    height:57px;

    border:1.5px solid #e3e7ef;

    border-radius:15px;

    outline:none;

    background:#fbfcfe;

    padding:0 47px 0 15px;

    font-family:"Cairo",sans-serif;

    font-size:16px;
    font-weight:600;

    color:#101828;

    direction:ltr;
    text-align:right;

    transition:.2s;
}

#serial::placeholder{
    color:#a8b0bd;

    font-weight:400;
}

#serial:focus{
    background:#fff;

    border-color:#0b5cff;

    box-shadow:
        0 0 0 4px rgba(11,92,255,.08);
}


/* =========================================
   BUTTON
========================================= */

.search-btn{
    width:100%;
    height:57px;

    margin-top:13px;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #0b5cff,
            #164bd1
        );

    color:#fff;

    font-family:"Cairo",sans-serif;

    font-size:14px;
    font-weight:800;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    box-shadow:
        0 11px 24px rgba(11,92,255,.18);

    transition:.15s;
}

.search-btn svg{
    width:19px;
    height:19px;

    stroke:#fff;
}

.search-btn:active{
    transform:scale(.985);
}

.search-btn:hover{
    box-shadow:
        0 14px 28px rgba(11,92,255,.25);
}

.search-btn:disabled{
    opacity:.65;

    cursor:not-allowed;

    box-shadow:none;
}


/* =========================================
   MESSAGE
========================================= */

.message{
    display:none;

    margin-top:15px;

    padding:13px 14px;

    border-radius:14px;

    font-size:12px;
    font-weight:600;

    line-height:1.9;

    text-align:center;
}

.message.show{
    display:block;
}

.message.loading{
    color:#175cd3;

    background:#eff6ff;

    border:1px solid #dbeafe;
}

.message.success{
    color:#087443;

    background:#ecfdf3;

    border:1px solid #d1fadf;
}

.message.error{
    color:#b42318;

    background:#fff4f2;

    border:1px solid #fee4e2;
}


/* =========================================
   LOADING
========================================= */

.loading-indicator{
    display:none;

    justify-content:center;
    align-items:center;

    gap:6px;

    margin-top:16px;
}

.loading-indicator.show{
    display:flex;
}

.loading-indicator span{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#0b5cff;

    animation:dot 1.2s infinite ease-in-out;
}

.loading-indicator span:nth-child(2){
    animation-delay:.15s;
}

.loading-indicator span:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{

    0%,80%,100%{
        transform:scale(.5);
        opacity:.3;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}


/* =========================================
   RESULT
========================================= */

.result{
    display:none;

    margin-top:20px;
}

.result.show{
    display:block;

    animation:
        resultAppear .35s ease;
}

@keyframes resultAppear{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================
   RESULT HEADER
========================================= */

.result-header{
    padding:18px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #f1f6ff,
            #f8faff
        );

    border:1px solid #e5edff;

    text-align:center;

    margin-bottom:10px;
}

.result-badge{
    width:40px;
    height:40px;

    margin:0 auto 8px;

    border-radius:13px;

    background:#e1edff;

    display:flex;
    align-items:center;
    justify-content:center;
}

.result-badge svg{
    width:20px;
    height:20px;

    stroke:#0b5cff;
}

.result-label{
    color:#8993a4;

    font-size:10px;
    font-weight:600;

    margin-bottom:4px;
}

.student-name{
    font-size:18px;

    line-height:1.8;

    font-weight:800;

    color:#101828;

    word-break:break-word;
}


/* =========================================
   RESULT GRID
========================================= */

.result-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;
}

.result-item{
    min-height:82px;

    background:#fff;

    border:1px solid #e9edf3;

    border-radius:16px;

    padding:14px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    position:relative;

    overflow:hidden;
}

.result-item::before{
    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:3px;

    background:#0b5cff;
}

.result-item-label{
    font-size:10px;

    color:#8a94a6;

    font-weight:600;

    margin-bottom:4px;
}

.result-item-value{
    font-size:15px;

    color:#101828;

    font-weight:800;
}

.serial-value{
    direction:ltr;
    text-align:right;
}


/* =========================================
   FOOTER (COMPACT DEVELOPER)
========================================= */

.footer{
    margin-top:20px;
    text-align:center;
}

.footer-line{
    width:100%;
    height:1px;
    background:#e8ebf0;
    margin-bottom:12px;
}

.dev-container{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}

.dev-title{
    font-size:11px;
    color:#8a94a6;
    font-weight:600;
}

.dev-title strong{
    color:#101828;
    font-weight:800;
}

.dev-links{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.dev-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 9px;
    border-radius:20px;
    text-decoration:none;
    font-size:10.5px;
    font-weight:700;
    transition:.15s ease;
}

.dev-btn-wa{
    background:#ecfdf3;
    color:#087443;
    border:1px solid #d1fadf;
}

.dev-btn-wa:hover{
    background:#dcfce7;
}

.dev-btn-tg{
    background:#f0f9ff;
    color:#0284c7;
    border:1px solid #e0f2fe;
}

.dev-btn-tg:hover{
    background:#e0f2fe;
}

.dev-btn svg{
    width:12px;
    height:12px;
    fill:currentColor;
}

.footer-copy{
    margin-top:8px;
    color:#a5adba;
    font-size:9.5px;
    font-weight:500;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:380px){

    .page{
        padding:17px 11px 28px;
    }

    .top-area{
        min-height:165px;
    }

    .corner-logo{
        width:72px;
        height:72px;

        padding:2px;

        border-width:1px;
    }

    .corner-right{
        right:1px;
    }

    .corner-left{
        left:1px;
    }

    .brand-icon{
        width:58px;
        height:58px;

        border-radius:18px;
    }

    .brand-icon svg{
        width:29px;
        height:29px;
    }

    .top-area h1{
        font-size:21px;
    }

    .main-card{
        padding:19px;

        border-radius:23px;
    }

    .student-name{
        font-size:17px;
    }

}


/* =========================================
   REDUCED MOTION
========================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }

}

</style>

</head>

function showMessage(

    type
){

    messageBox.innerHTML =

function hideMessage(){

    messageBox.innerHTML =

   LISTENER
========================================= */

function stopListener(){

    if(
        currentListener
    ){

        currentListener();

        currentListener =
            null;

    }

}



/* =========================================
   TIMERS
========================================= */

function stopTimers(){

    if(
        timeoutTimer
    ){

        clearTimeout(
            timeoutTimer
        );

        timeoutTimer =
            null;

    }


    if(
        countdownTimer
    ){

        clearInterval(
            countdownTimer
        );

        countdownTimer =
            null;

    }

}



/* =========================================
   BUTTON
========================================= */

function setLoadingState(){

    searchBtn.disabled =
        true;

    buttonText.textContent =
        "جاري البحث...";

    loadingIndicator.classList.add(
        "show"
    );

}


function resetButton(){

    searchBtn.disabled =
        false;

    buttonText.textContent =
        "استعلام عن النتيجة";

    loadingIndicator.classList.remove(
        "show"
    );

}



/* =========================================
   COUNTDOWN
========================================= */

function updateLoadingMessage(){

    showMessage(

        "جاري البحث عن النتيجة...<br>" +

        "يرجى الانتظار " +

        "<b>" +

        secondsLeft +

        "</b> ثانية",

        "loading"

    );

}


function startCountdown(){

    secondsLeft =
        60;

    updateLoadingMessage();


    countdownTimer =
        setInterval(

            function(){

                secondsLeft--;


                if(
                    secondsLeft < 0
                ){

                    secondsLeft =
                        0;

                }


                updateLoadingMessage();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(
                        countdownTimer
                    );

                    countdownTimer =
                        null;

                }

            },

            1000

        );

}



/* =========================================
   TIMEOUT
========================================= */

function startTimeout(){

    timeoutTimer =
        setTimeout(

            function(){

                stopListener();

                stopTimers();

                resetButton();


                showMessage(

                    "انتهت مهلة الانتظار.<br>" +
                    "يرجى المحاولة مرة أخرى.",

                    "error"

                );

            },

            60000

        );

}



/* =========================================
   CREATE REQUEST
========================================= */

async function createRequest(){

    const serial =
        serialInput.value.trim();


    resultBox.classList.remove(
        "show"
    );

    hideMessage();

    stopTimers();

    stopListener();


    if(
        !serial
    ){

        showMessage(
            "يرجى إدخال رقم الجلوس.",
            "error"
        );

        serialInput.focus();

        return;

    }


    if(
        !/^[0-9]+$/.test(
            serial
        )
    ){

        showMessage(
            "رقم الجلوس يجب أن يحتوي على أرقام فقط.",
            "error"
        );

        serialInput.focus();

        return;

    }


    if(
        !database
    ){

        showMessage(
            "تعذر الاتصال بالخدمة حالياً.",
            "error"
        );

        return;

    }


    setLoadingState();


    try{

        const requestsRef =
            ref(
                database,
                "requests"
            );


        const requestData = {

            serial:
                serial,

            status:
                "waiting",

            name:
                "",

            result:
                "",

            percentage:
                "",

            message:
                "",

            createdAt:
                Date.now()

        };


        const newRequest =
            await push(
                requestsRef,
                requestData
            );


        const requestId =
            newRequest.key;


        if(
            !requestId
        ){

            throw new Error(
                "تعذر إنشاء الطلب."
            );

        }


        startCountdown();

        startTimeout();

        listenToRequest(
            requestId
        );


    }catch(error){

        console.error(
            "Firebase ERROR:",
            error
        );


        stopTimers();

        stopListener();

        resetButton();


        showMessage(
            "حدث خطأ أثناء إرسال الطلب.",
            "error"
        );

    }

}



/* =========================================
   LISTEN REQUEST
========================================= */

function listenToRequest(
    requestId
){

    const requestRef =
        ref(
            database,
            "requests/" +
            requestId
        );


    currentListener =
        onValue(

            requestRef,

            function(snapshot){

                const data =
                    snapshot.val();


                if(
                    !data
                ){

                    stopTimers();

                    stopListener();

                    resetButton();


                    showMessage(
                        "تعذر العثور على الطلب.",
                        "error"
                    );

                    return;

                }


                if(
                    data.status ===
                    "waiting"
                ){

                    updateLoadingMessage();

                    return;

                }


                if(
                    data.status ===
                    "processing"
                ){

                    showMessage(

                        "جاري استخراج النتيجة...<br>" +

                        "يرجى الانتظار " +

                        "<b>" +

                        secondsLeft +

                        "</b> ثانية",

                        "loading"

                    );

                    return;

                }


                if(
                    data.status ===
                    "error"
                ){

                    stopTimers();

                    stopListener();

                    resetButton();


                    showMessage(

                        data.message ||
                        "تعذر الحصول على النتيجة.",

                        "error"

                    );

                    return;

                }


                if(
                    data.status ===
                    "completed"
                ){

                    stopTimers();

                    stopListener();


                    studentName.textContent =
                        data.name ||
                        "غير متوفر";


                    studentSerial.textContent =
                        data.serial ||
                        serial;


                    percentage.textContent =
                        data.percentage ||
                        "غير متوفرة";


                    resultBox.classList.add(
                        "show"
                    );


                    resetButton();


                    showMessage(

                        "تم العثور على النتيجة بنجاح.",

                        "success"

                    );


                    setTimeout(

                        function(){

                            resultBox.scrollIntoView({

                                behavior:
                                    "smooth",

                                block:
                                    "nearest"

                            });

                        },

                        100

                    );

                }

            },


            function(error){

                console.error(
                    "Firebase listener error:",
                    error
                );


                stopTimers();

                stopListener();

                resetButton();


                showMessage(
                    "حدث خطأ أثناء متابعة الطلب.",
                    "error"
                );

            }

        );

}



/* =========================================
   EVENTS
========================================= */

searchBtn.addEventListener(
    "click",
    createRequest
);


serialInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            createRequest();

        }

    }
);


serialInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

    }
);

</script>
